name: resume

on:
  pull_request:
  push:
    branches: [main]
    tags: ['resume-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Release tags are resume-YYYY.MM.DD, with .1, .2, ... for more releases on the same day. See release.sh.
      - name: Check release tag format
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "${TAG}" | grep -qE '^resume-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[1-9][0-9]*)?$'; then
            echo "::error::Tag '${TAG}' does not match resume-YYYY.MM.DD or resume-YYYY.MM.DD.N. Run 'make release' to create release tags."
            exit 1
          fi
          echo "Tag '${TAG}' has the release format."

      - uses: actions/checkout@v7.0.1

      # Same image and same build script as a local `make gen`.
      - name: Build image
        run: make build

      # SOURCE_DATE_EPOCH is the commit time, so a local build of the same commit with the same value gives the
      # same PDF bytes. build_resume.sh exits with an error if pdflatex fails.
      - name: Compile ds_resume.tex
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH FORCE_SOURCE_DATE=1
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
          make gen

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ds_resume
          path: output/resume_stadther_dillon.pdf
          if-no-files-found: error

  release:
    # Runs on a resume-* tag push, or on a manual run started from a tag.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'resume-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ds_resume

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="resume_stadther_dillon_${TAG}.pdf"
          mv resume_stadther_dillon.pdf "${asset}"
          gh release create "${TAG}" "${asset}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Resume ${TAG#resume-}" \
            --notes "Resume PDF built from tag ${TAG}."
